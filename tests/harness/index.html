<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>dsh-media-skin harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        background: #c9d2dd;
        /* 模拟 DSH 主题 token，否则面板里的 var(--dsw-*) 全部落空、背景透明。 */
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #f4f6f9;
        --dsw-alias-bg-base: #f5f6f8;
        --dsw-alias-label-primary: #1d2129;
        --dsw-alias-label-secondary: #667085;
        --dsw-alias-label-tertiary: #98a2b3;
        --dsw-alias-border-l1: #e4e7ec;
        --dsw-alias-border-l2: #d0d5dd;
        --dsw-alias-brand-primary: #3b82f6;
        --dsw-alias-interactive-bg-hover: rgba(29, 33, 41, 0.06);
        --dsw-alias-scrollbar-bg-l2: rgba(29, 33, 41, 0.16);
        --dsw-alias-scrollbar-hover-l2: rgba(29, 33, 41, 0.3);
        --dsw-alias-state-warn-primary: #b54708;
        --dsw-alias-state-error-primary: #d92d20;
        --dsw-font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #fake-app {
        position: absolute;
        inset: 0;
        display: flex;
      }
      #fake-app .fake-sidebar {
        width: 264px;
        flex: 0 0 264px;
        background: #232a35;
        color: #cfd6e2;
        padding: 18px;
        box-sizing: border-box;
      }
      #fake-app .fake-main {
        flex: 1 1 auto;
        padding: 24px;
        box-sizing: border-box;
      }
      #log {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: 60vw;
        max-height: 30vh;
        overflow: auto;
        white-space: pre-wrap;
        background: rgba(0, 0, 0, 0.6);
        color: #ffd7d7;
        font: 11px/1.4 monospace;
        padding: 6px 8px;
        border-radius: 6px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="fake-app">
      <div class="fake-sidebar">左侧栏（模拟 DSH 侧栏 264px）</div>
      <div class="fake-main">内容区</div>
    </div>
    <div id="root"></div>
    <div id="log"></div>

    <!-- React 18.3.1 的 UMD（生产版）不进仓库，见 .gitignore；本地这样取：
         curl -Lo tests/harness/react.js     https://unpkg.com/react@18.3.1/umd/react.production.min.js
         curl -Lo tests/harness/react-dom.js https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js
         然后直接用浏览器打开本文件（file:// 即可，头像走 window.__DMS_AVATAR__）。 -->
    <script src="react.js"></script>
    <script src="react-dom.js"></script>
    <script>
      window.__errors = []
      window.__log = function (message) {
        document.getElementById('log').textContent = window.__errors.join('\n')
      }
      window.addEventListener('error', function (event) {
        window.__errors.push('ERR: ' + (event.message || event.error))
        window.__log()
      })
      window.addEventListener('unhandledrejection', function (event) {
        window.__errors.push('REJ: ' + (event.reason && event.reason.message ? event.reason.message : event.reason))
        window.__log()
      })
      // 验收页没有宿主路由：头像直接指到仓库里的位图。
      window.__DMS_AVATAR__ = '../../assets/avatar.png'
      window.__ModuleLoader__ = {
        specs: [],
        load: function (spec) {
          this.specs.push(spec)
        },
      }
    </script>
    <script src="../../client.js"></script>
    <script>
      ;(function () {
        var W = 1600
        var H = 900
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="' +
          W +
          '" height="' +
          H +
          '">' +
          '<rect width="' +
          W +
          '" height="' +
          H +
          '" fill="#1b2740"/>' +
          '<rect x="0" y="0" width="' +
          W +
          '" height="' +
          H / 3 +
          '" fill="#2d4a7a"/>' +
          '<rect x="0" y="' +
          (H / 3) * 2 +
          '" width="' +
          W +
          '" height="' +
          H / 3 +
          '" fill="#121a2b"/>' +
          '<circle cx="400" cy="450" r="150" fill="#e2b04a"/>' +
          '<rect x="1200" y="150" width="220" height="220" fill="#d85f5f"/>' +
          '<text x="60" y="120" font-size="90" fill="#ffffff">TOP-LEFT</text>' +
          '<text x="1080" y="840" font-size="80" fill="#7de0a4">BOTTOM-RIGHT</text>' +
          '</svg>'
        var mediaUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)

        function emptyLayer(key) {
          return { key: key, kind: 'none', name: '', size: 0, source: 'none', available: false, url: null }
        }
        function imageLayer(key) {
          return { key: key, kind: 'image', name: 'wall-test.svg', size: 204800, source: 'upload', available: true, url: mediaUrl }
        }

        var LOOK = { blur: 0, mediaOpacity: 100, brightness: 100, saturate: 100, contrast: 100 }

        var settings = {
          version: 3,
          enabled: true,
          mode: 'full',
          layers: {
            full: { media: { source: 'upload', path: 'wall-test.svg', name: 'wall-test.svg' }, crop: { x: 0.5, y: 0.5, zoom: 1 }, look: Object.assign({}, LOOK) },
            main: { media: { source: 'none', path: '', name: '' }, crop: { x: 0.5, y: 0.5, zoom: 1 }, look: Object.assign({}, LOOK) },
            sidebar: { media: { source: 'none', path: '', name: '' }, crop: { x: 0.5, y: 0.5, zoom: 1 }, look: Object.assign({}, LOOK) },
          },
          surface: 15,
          sidebar: 48,
          video: { rate: 1, paused: false },
          panel: { open: true },
        }
        var layers = { full: imageLayer('full'), main: emptyLayer('main'), sidebar: emptyLayer('sidebar') }

        function payload() {
          return { settings: JSON.parse(JSON.stringify(settings)), layers: layers }
        }

        function mergeDeep(base, patch) {
          var out = Object.assign({}, base)
          Object.keys(patch || {}).forEach(function (key) {
            var value = patch[key]
            var previous = out[key]
            if (
              value &&
              typeof value === 'object' &&
              !Array.isArray(value) &&
              previous &&
              typeof previous === 'object' &&
              !Array.isArray(previous)
            ) {
              out[key] = mergeDeep(previous, value)
            } else {
              out[key] = value
            }
          })
          return out
        }

        window.__posts = []
        window.fetch = function (url, init) {
          var method = (init && init.method) || 'GET'
          if (method === 'POST') {
            // 上传：body 是 File/Blob，图层走 x-dms-layer 头。
            if (init && init.body && typeof init.body === 'object' && typeof init.body.size === 'number') {
              var headerLayer = (init.headers && init.headers['x-dms-layer']) || 'full'
              window.__posts.push({ upload: { layer: headerLayer, name: init.headers && init.headers['x-dms-name'] } })
              settings.layers[headerLayer].media = { source: 'upload', path: 'uploaded.svg', name: 'uploaded.svg' }
              layers[headerLayer] = imageLayer(headerLayer)
              return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(payload()) } })
            }
            var body = init && init.body ? JSON.parse(init.body) : {}
            window.__posts.push(body)
            settings = mergeDeep(settings, body)
            // 素材补丁：把对应图层标成可用，模拟宿主 describe()。
            Object.keys(body.layers || {}).forEach(function (key) {
              var media = body.layers[key] && body.layers[key].media
              if (!media) return
              if (media.source === 'none') layers[key] = emptyLayer(key)
              else layers[key] = imageLayer(key)
            })
            return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(payload()) } })
          }
          return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve(payload()) } })
        }

        var spec = window.__ModuleLoader__.specs.filter(function (item) {
          return item.id === 'dsh-media-skin'
        })[0]
        if (!spec) {
          window.__errors.push('factory 未注册')
          window.__log()
          return
        }

        var plugin = spec.factory(function (name) {
          return name === 'react' ? window.React : undefined
        })

        var registered = null
        var ctx = {
          get: function () {
            return undefined
          },
          effect: function (fn) {
            return fn()
          },
          slots: {
            inject: function (name, fn) {
              return fn()
            },
            register: function (options, Component) {
              registered = Component
              return function () {}
            },
          },
        }
        plugin.apply(ctx)

        window.__ready = true
        var root = window.ReactDOM.createRoot(document.getElementById('root'))
        root.render(window.React.createElement(registered))
        window.__plugin = plugin
      })()
    </script>
  </body>
</html>
